name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.project }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: "1.21.1-fabric"
            minecraft: "1.21.1"
            loader: fabric
            java: "21"
          - project: "1.21.1-neoforge"
            minecraft: "1.21.1"
            loader: neoforge
            java: "21"
          - project: "1.21.10-fabric"
            minecraft: "1.21.10"
            loader: fabric
            java: "21"
          - project: "1.21.10-neoforge"
            minecraft: "1.21.10"
            loader: neoforge
            java: "21"
          - project: "26.2-fabric"
            minecraft: "26.2"
            loader: fabric
            java: "25"
          - project: "26.2-neoforge"
            minecraft: "26.2"
            loader: neoforge
            java: "25"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: gradle

      - name: Build variant
        env:
          BUILD_PROJECT: ${{ matrix.project }}
        run: ./gradlew --no-daemon ":${BUILD_PROJECT}:buildAndCollect"

      - name: Prepare release asset
        env:
          BUILD_PROJECT: ${{ matrix.project }}
          LOADER: ${{ matrix.loader }}
          MINECRAFT_VERSION: ${{ matrix.minecraft }}
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          mod_version="$(awk -F= '$1 == "mod.version" { print $2; exit }' gradle.properties)"
          if [[ -z "$mod_version" || "$tag_version" != "$mod_version" ]]; then
            echo "Tag $GITHUB_REF_NAME must match mod.version ($mod_version)." >&2
            exit 1
          fi

          plugin_name="${GITHUB_REPOSITORY##*/}"
          artifact="$(find "build/libs/$mod_version" -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' -print -quit)"
          if [[ -z "$artifact" ]]; then
            echo "No built JAR found for $BUILD_PROJECT." >&2
            exit 1
          fi

          mkdir -p release-assets
          cp "$artifact" "release-assets/${plugin_name}-${LOADER}-mc${MINECRAFT_VERSION}-v${mod_version}.jar"

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.project }}
          path: release-assets/*.jar
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download JARs
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: AFK Auto Sleep ${{ github.ref_name }}
          generate_release_notes: true
          files: release-assets/*.jar
          fail_on_unmatched_files: true